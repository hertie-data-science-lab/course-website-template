# DO NOT EDIT this file on a DSL-managed course site: the daily site sync
# regenerates it, so manual edits here are overwritten. Declare instructors and
# TAs in the cohort's `classroom-config/people.yml` (cohort site) or in the
# `people:` block of the course org's `.github/dsl-course.yml` (course site)
# instead - photos can still live under `_images/pp/` in this repo (that dir is
# served and never rewritten by the sync).
#
# Only edit this file directly if this site is standalone (not synced).

instructors:
  - name: "Instructor Name"
    profile_pic: /_images/pp/placeholder.jpg
    webpage: "https://hertie-school.org/en/datasciencelab"

teaching_assistants:
  - name: "TA Name"
    profile_pic: /_images/pp/placeholder.jpg
    webpage: ""
